<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Fullstack App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        button.add-btn {
            padding: 12px 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button.add-btn:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
        }

        .task-item {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #a71d2a;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Full-stack App (Flask API + JS)</p>

        <div class="input-group">
            <input type="text" id="title" placeholder="Rubuta sabon aiki (Task)...">
            <button onclick="addTask()" class="add-btn">Saka</button>
        </div>

        <ul id="taskList">
            <!-- Ayyuka za su bayyana a nan -->
        </ul>

        <footer>
            Built with ❤️ by <b>Abdurrahman</b>
        </footer>
    </div>

    <script>
        // Sanya '/tasks' domin ya yi amfani da Render server kai tsaye
        const API_URL = '/tasks';

        // 1. Samo dukkan Tasks daga Database
        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                
                const taskList = document.getElementById('taskList');
                taskList.innerHTML = '';

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.innerHTML = `
                        <span>${task.title}</span>
                        <button onclick="deleteTask(${task.id})" class="delete-btn">Goge</button>
                    `;
                    taskList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching tasks:', error);
            }
        }

        // 2. Kara Sabon Task
        async function addTask() {
            const titleInput = document.getElementById('title');
            const title = titleInput.value.trim();

            if (!title) {
                alert('Da fatan ka rubuta sunan aikin!');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: title })
                });

                if (response.ok) {
                    titleInput.value = '';
                    fetchTasks(); // Sake sabunta jerin ayyuka
                } else {
                    alert('Akwai matsala wajen saka aikin!');
                }
            } catch (error) {
                alert('An samu kuskure wajen haɗawa da Server!');
            }
        }

        // 3. Goge Task
        async function deleteTask(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchTasks(); // Sake sabunta jerin ayyuka bayan an goge
                }
            } catch (error) {
                alert('An samu kuskure wajen goge aikin!');
            }
        }

        // Kira shafin farko idan an bude gidan yanar gizo
        document.addEventListener('DOMContentLoaded', fetchTasks);
    </script>
</body>
</html>
