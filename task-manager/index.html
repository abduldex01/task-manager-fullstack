<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abduldex - Task Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; display: flex; justify-content: center; padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background-color: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #007bff; font-size: 36px; letter-spacing: 1px; }
        .header p { color: #aaa; font-size: 16px; margin-top: 5px; }

        .notify-btn { width: 100%; padding: 10px; background: #28a745; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }

        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        label { font-size: 12px; color: #888; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; outline: none; }
        .date-time-container { display: flex; gap: 10px; }
        .field { flex: 1; }
        button.add-btn { width: 100%; padding: 12px; background: #007bff; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .filters { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .filter-btn { padding: 8px 15px; background: #333; border: none; color: white; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .filter-btn.active { background: #007bff; }

        .task-item { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-info { flex: 1; cursor: pointer; }
        .completed { text-decoration: line-through; opacity: 0.6; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Abduldex</h1>
            <p>Task Manager</p>
        </div>

        <button class="notify-btn" onclick="requestNotificationPermission()">🔔 Enable Notifications</button>

        <div class="input-group">
            <div>
                <label>Task Title</label>
                <input type="text" id="title" placeholder="What needs to be done?">
            </div>
            <div class="date-time-container">
                <div class="field">
                    <label>Due Date</label>
                    <input type="date" id="taskDate">
                </div>
                <div class="field">
                    <label>Time</label>
                    <input type="time" id="taskTime">
                </div>
            </div>
            <button onclick="addTask()" class="add-btn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
            <button class="filter-btn" onclick="filterTasks('active', this)">Active</button>
            <button class="filter-btn" onclick="filterTasks('completed', this)">Completed</button>
        </div>

        <ul id="taskList" style="list-style: none;"></ul>
    </div>

    <script>
        let allTasks = [];
        let notifiedTasks = new Set();

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notifications Enabled Successfully!");
                    } else {
                        alert("Permission Denied!");
                    }
                });
            } else {
                alert("Browser does not support notifications.");
            }
        }

        async function fetchTasks() {
            const res = await fetch('/tasks');
            allTasks = await res.json();
            renderTasks('all');
        }

        function renderTasks(filter) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            allTasks.filter(t => {
                if (filter === 'active') return !t.completed;
                if (filter === 'completed') return t.completed;
                return true;
            }).forEach(t => {
                const li = document.createElement('li');
                li.className = `task-item ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-info" onclick="toggleTask(${t.id})">
                        <b>${t.title}</b><br>
                        <small style="color:#007bff;">${t.due_date || ''} ${t.due_time || ''}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${t.id})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        function filterTasks(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks(type);
        }

        async function addTask() {
            const title = document.getElementById('title').value;
            if(!title) return;
            await fetch('/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    title, 
                    due_date: document.getElementById('taskDate').value,
                    due_time: document.getElementById('taskTime').value
                })
            });
            document.getElementById('title').value = '';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskTime').value = '';
            fetchTasks();
        }

        async function toggleTask(id) {
            await fetch(`/tasks/${id}`, { method: 'PUT' });
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`/tasks/${id}`, { method: 'DELETE' });
            fetchTasks();
        }

        // Tsarin Duba Lokacin Task
        setInterval(() => {
            const now = new Date();
            const currentDate = now.toISOString().split('T')[0];
            const currentTime = now.toTimeString().slice(0, 5);

            allTasks.forEach(task => {
                if (!task.completed && task.due_date === currentDate && task.due_time === currentTime) {
                    if (!notifiedTasks.has(task.id)) {
                        if (Notification.permission === "granted") {
                            new Notification("Abduldex Task Reminder ⏰", {
                                body: `Time to perform your task: "${task.title}"`,
                                icon: "https://cdn-icons-png.flaticon.com/512/3119/3119338.png"
                            });
                        }
                        notifiedTasks.add(task.id);
                    }
                }
            });
        }, 10000); // Yana duba duk bayan sakandari 10

        fetchTasks();
    </script>
</body>
</html>
