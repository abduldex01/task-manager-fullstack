<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shafina na Kanka</title>
  
  <!-- CSS: Wannan bangaren shi ke kawa da gyara kyan shafin -->
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: #f4f4f9; 
      color: #333; 
    }
    img { 
      width: 150px; 
      height: 150px; 
      border-radius: 50%; /* Ya sa hoton ya zama mai zagaye (round) */
      object-fit: cover; 
      margin-top: 15px; 
    }
    .card { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      max-width: 400px; 
      margin: 0 auto; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    }
    a { 
      display: inline-block; 
      margin-top: 20px; 
      padding: 10px 20px; 
      background-color: #007bff; 
      color: white; 
      text-decoration: none; 
      border-radius: 5px; 
    }
  </style>
</head>
<body>

  <!-- Card: Akwatin farar takardar da ke dauke da bayananka -->
  <div class="card">
    
    <!-- Hotonka da ka ajiye a foldar -->
    <img src="my-photo.jpg" alt="Hotona">
    
    <h1>Abdurrahman</h1>
    <p><strong>Ɗalibi & Mai Koyon Kodi</strong></p>
    
    <h3>Tarihina a Ƙaitace:</h3>
    <p>Sannu! Ni Abdurrahman ne. Ina da sha'awar harkar fasaha da kera gidajen yanar gizo. Yanzu haka ina koyon yadda ake gina gidajen yanar gizo tun daga tushe.</p>

    <!-- Wannan link din zai sadar da mutum zuwa shafi na biyu (social.html) -->
    <a href="social.html">Tuntuɓe Ni (Social Media) &rarr;</a>
    
  </div>

</body>
</html>
