<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanyoyin Saduwa</title>

  <!-- CSS: Tsarin ƙawata shafin na biyu -->
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: #f4f4f9; 
      color: #333; 
    }
    .card { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      max-width: 400px; 
      margin: 0 auto; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    }
    ul { 
      list-style: none; /* Ya cire alamar ɗigo-ɗigo ta jeri */
      padding: 0; 
    }
    li { 
      margin: 15px 0; 
    }
    .btn { 
      display: block; 
      padding: 10px; 
      background: #28a745; 
      color: white; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: bold; 
    }
    .back-btn { 
      display: inline-block; 
      margin-top: 20px; 
      color: #007bff; 
      text-decoration: none; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Hanyoyina na Saduwa</h2>
    <p>Za ka iya tuntuɓa ta ta waɗannan kafafen:</p>

    <!-- Jerin Hanyoyin Saduwa (Links) -->
    <ul>
      <li><a href="https://wa.me/2340000000000" target="_blank" class="btn">WhatsApp</a></li>
      <li><a href="https://github.com" target="_blank" class="btn">GitHub</a></li>
      <li><a href="https://linkedin.com" target="_blank" class="btn">LinkedIn</a></li>
    </ul>

    <!-- Wannan link din zai maida mu baya zuwa shafin farko (index.html) -->
    <a href="index.html" class="back-btn">&larr; Koma Babban Shafi</a>
  </div>

</body>
</html>
